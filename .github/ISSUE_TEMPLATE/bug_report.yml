name: NapCatQQ-clasic 问题报告
description: 记录本固定快照的可复现问题
title: '[BUG] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索本仓库现有报告，并按下面字段记录复现证据。
        此项目是 NapCatQQ-clasic 固定快照；版本信息请以本仓库 Release 为准。
        日志中请移除 WebUI token、访问令牌、账号密码和个人聊天内容。
  - type: input
    id: clasic-version
    attributes:
      label: NapCatQQ-clasic 版本 / 镜像标签
      placeholder: '1.0.0 / ghcr.io/OWNER/napcatqq-clasic:1.0.0'
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与 CPU 架构
      placeholder: 'Ubuntu 24.04 amd64 / Windows 11 x64'
    validations:
      required: true
  - type: input
    id: qq-version
    attributes:
      label: QQ 版本与启动方式
      placeholder: '3.2.34-53644 / docker compose / Shell loader / Framework'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
      placeholder: |
        1. 使用的配置与操作
        2. 实际结果
        3. 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志与错误输出
      description: 请保留错误发生的时间及上下文，并移除敏感配置值。
      render: text
