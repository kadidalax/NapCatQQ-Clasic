name: NapCatQQ-clasic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clasic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NAPCAT_REPOSITORY: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  check-and-build:
    name: Typecheck, tests and source artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: pnpm
      - name: Install the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify project identity, freeze and licensing
        run: pnpm run check:project
      - name: Typecheck all workspace packages
        run: pnpm run typecheck
      - name: Run workspace tests without watch mode
        run: pnpm test
      - name: Test deployment and packaging helpers
        run: pnpm run test:deployment
      - name: Generate a local CI version
        id: version
        run: node .github/scripts/ci-metadata.mjs
      - name: Build Shell, Framework, WebUI, plugin and OpenAPI
        env:
          NAPCAT_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build:artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: NapCatQQ-clasic-ci-artifacts
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-loader:
    name: Existing Windows Shell loader regression
    needs: check-and-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: NapCatQQ-clasic-ci-artifacts
          path: dist
      - name: Build and run native loader file-query regression
        shell: pwsh
        run: |
          cmake -S .github/tests/windows-loader -B "$env:RUNNER_TEMP/clasic-windows-loader" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/clasic-windows-loader" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/clasic-windows-loader/Release/windows-loader-test.exe" "$pwd/dist/shell/NapCatWinBootHook.dll" "$pwd/dist/shell/loadNapCat.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docker:
    name: Source Docker and Compose smoke (${{ matrix.arch }})
    needs: check-and-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LOCAL_IMAGE: napcatqq-clasic:ci-${{ matrix.arch }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build this repository, not a prebuilt project image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            NAPCAT_VERSION=${{ needs.check-and-build.outputs.version }}
            NAPCAT_REPOSITORY=${{ github.repository }}
            NAPCAT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=clasic-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=clasic-${{ matrix.arch }}
      - name: Verify native dependencies, WebUI and persisted restart
        run: bash .github/scripts/smoke-docker.sh
      - name: Verify pinned AstrBot joint deployment and shared media
        run: bash .github/scripts/smoke-astrbot.sh
